  <g transform="translate(32 32) scale(0.64) translate(-32.8 -36)">
    <g transform="rotate(-8 32 40)">
      <path fill="#ffffff" d="M14 36 C14 20 22 10 32 10 C42 10 50 20 50 36 Z"/>
      <ellipse fill="#5b4bc4" cx="25.5" cy="27" rx="3.2" ry="4.2"/>
      <ellipse fill="#5b4bc4" cx="38.5" cy="27" rx="3.2" ry="4.2"/>
      <rect fill="#d9d4f5" stroke="#ffffff" x="6" y="34" width="52" height="24" rx="4.5" stroke-width="3"/>
      <rect fill="#5b4bc4" opacity="0.6" x="14" y="42" width="24" height="3" rx="1.5"/>
      <rect fill="#5b4bc4" opacity="0.6" x="14" y="48.5" width="16" height="3" rx="1.5"/>
      <circle fill="#ffffff" cx="20" cy="34.5" r="4.2"/>
      <circle fill="#ffffff" cx="44" cy="34.5" r="4.2"/>
    </g>
  </g>
</svg>
