{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Přihlášení" %} · Vokie{% endblock %}

{% block content %}
  <article class="narrow">
    <header>
      <h1>Vokie</h1>
      <p>{% translate "Přihlas se svým e-mailem." %}</p>
    </header>

    <form method="post">
      {% csrf_token %}
      {{ form }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">{% translate "Přihlásit se" %}</button>
    </form>
  </article>
{% endblock %}
