{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Přihlášení" %} · Vocaboo{% endblock %}

{% block content %}
  <article class="narrow">
    <header class="login-brand">
      {% include "_logo.html" with class="logo-big" %}
      <h1>Vocaboo</h1>
      <p class="brand-slogan">catch them all</p>
      <p>{% translate "Přihlas se svým e-mailem." %}</p>
    </header>

    <form method="post">
      {% csrf_token %}
      {{ form }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">{% translate "Přihlásit se" %}</button>
    </form>
  </article>
{% endblock %}
