# nginx for Vocaboo: static files from disk, everything else to gunicorn.
# Installed by deploy/install.sh to /etc/nginx/sites-available/vocaboo only when it is not
# there yet, because certbot adds its HTTPS part to the installed file.

# How the browser talks to the server, for Django (HTTPS redirect, secure cookies). Behind
# Cloudflare Tunnel nginx gets plain http, but Cloudflare sends X-Forwarded-Proto: https;
# without that header (at home over the IP address, or HTTPS by certbot) nginx's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # The only site on this server: it also answers to the IP address of the Pi at home
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vocaboo.me;

    # Forms of the app are small; a bigger upload is refused
    client_max_body_size 2m;

    # Static files straight from disk, Django does not serve them in production
    location /static/ {
        alias /srv/vocaboo/app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/vocaboo/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django knows from this that the browser uses HTTPS (see the map above)
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }
}
